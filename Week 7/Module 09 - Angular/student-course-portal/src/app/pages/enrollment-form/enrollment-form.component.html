<div class="form-container">
  <h2>Student Enrollment Request (Template-Driven Form)</h2>

  <!-- Hands-On 4 Task 2 Step 46: Success message alert -->
  <div *ngIf="isSubmitted" class="alert alert-success">
    Enrollment request submitted successfully!
  </div>

  <!-- Hands-On 4 Task 1 Step 39: Template-driven form with #enrollForm="ngForm" -->
  <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)" novalidate>
    <!-- Field: studentName -->
    <div class="form-group">
      <label for="studentName">Student Name *</label>
      <input
        type="text"
        id="studentName"
        name="studentName"
        [(ngModel)]="studentName"
        required
        minlength="3"
        #nameCtrl="ngModel"
        class="form-control"
      />
      <!-- Hands-On 4 Task 2 Step 44: Conditional error messages -->
      <div *ngIf="nameCtrl.touched && nameCtrl.errors" class="error-msg">
        <span *ngIf="nameCtrl.errors['required']">Name is required</span>
        <span *ngIf="nameCtrl.errors['minlength']">Name must be at least 3 characters</span>
      </div>
    </div>

    <!-- Field: studentEmail -->
    <div class="form-group">
      <label for="studentEmail">Student Email *</label>
      <input
        type="email"
        id="studentEmail"
        name="studentEmail"
        [(ngModel)]="studentEmail"
        required
        email
        #emailCtrl="ngModel"
        class="form-control"
      />
      <div *ngIf="emailCtrl.touched && emailCtrl.errors" class="error-msg">
        <span *ngIf="emailCtrl.errors['required']">Email is required</span>
        <span *ngIf="emailCtrl.errors['email']">Please enter a valid email address</span>
      </div>
    </div>

    <!-- Field: courseId -->
    <div class="form-group">
      <label for="courseId">Course ID *</label>
      <input
        type="number"
        id="courseId"
        name="courseId"
        [(ngModel)]="courseId"
        required
        #courseCtrl="ngModel"
        class="form-control"
      />
      <div *ngIf="courseCtrl.touched && courseCtrl.errors" class="error-msg">
        <span *ngIf="courseCtrl.errors['required']">Course ID is required</span>
      </div>
    </div>

    <!-- Field: preferredSemester -->
    <div class="form-group">
      <label for="preferredSemester">Preferred Semester</label>
      <select
        id="preferredSemester"
        name="preferredSemester"
        [(ngModel)]="preferredSemester"
        class="form-control"
      >
        <option value="Odd">Odd Semester</option>
        <option value="Even">Even Semester</option>
      </select>
    </div>

    <!-- Field: agreeToTerms -->
    <div class="form-group checkbox-group">
      <label>
        <input
          type="checkbox"
          id="agreeToTerms"
          name="agreeToTerms"
          [(ngModel)]="agreeToTerms"
          required
          #termsCtrl="ngModel"
        />
        I agree to the enrollment terms and conditions *
      </label>
      <div *ngIf="termsCtrl.touched && termsCtrl.errors" class="error-msg">
        <span *ngIf="termsCtrl.errors['required']">You must agree to terms before submitting</span>
      </div>
    </div>

    <!-- Hands-On 4 Task 1 Step 41 & Task 2 Step 47: Submit and Reset buttons -->
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="enrollForm.invalid">Submit</button>
      <button type="button" class="btn btn-secondary" (click)="onReset(enrollForm)">Reset</button>
    </div>
  </form>
</div>
