version: "3.9"

services:
  frontend:
    build:
      context: ..
      dockerfile: "Module 13 - Docker/Dockerfile.frontend"
    ports:
      - "4200:80"
    depends_on:
      - backend

  backend:
    # Point this at whichever Spring Boot project you Dockerized
    # using Dockerfile.backend.sample (e.g. CountryRESTService from Week 3).
    build:
      context: ../path-to-your-spring-boot-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker

# Run with: docker compose up --build
