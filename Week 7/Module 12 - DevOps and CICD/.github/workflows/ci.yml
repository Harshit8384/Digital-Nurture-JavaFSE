name: CI Pipeline - Student Course Portal

# Trigger: run on every push and pull request targeting main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Module 09 - Angular/student-course-portal/package-lock.json'

      - name: Install dependencies
        working-directory: Module 09 - Angular/student-course-portal
        run: npm ci

      - name: Lint (if configured)
        working-directory: Module 09 - Angular/student-course-portal
        run: npm run lint --if-present

      - name: Run unit tests (headless)
        working-directory: Module 09 - Angular/student-course-portal
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Build production bundle
        working-directory: Module 09 - Angular/student-course-portal
        run: npx ng build --configuration production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-course-portal-dist
          path: Module 09 - Angular/student-course-portal/dist
